name: Build and Publish ImageMagick Binaries

'on':
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: Force build even if the repo tag already exists
        required: false
        default: false
        type: boolean
      release_tag:
        description: Specific ImageMagick tag to build (leave empty for latest)
        required: false
        type: string
      full_delegates:
        description: Enable extra source-built delegates (HEIC/RAW/LQR)
        required: false
        default: true
        type: boolean

jobs:
  check-and-build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      should_build: ${{ steps.check-release.outputs.should_build }}
      release_tag: ${{ steps.check-release.outputs.release_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for new ImageMagick release
        id: check-release
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_BUILD: ${{ github.event.inputs.force_build || 'false' }}
          MANUAL_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euxo pipefail

          if [ -n "$MANUAL_TAG" ]; then
            RELEASE_TAG="$MANUAL_TAG"
            echo "Using manually specified release: $RELEASE_TAG"
          else
            RELEASE_TAG="$(gh api repos/ImageMagick/ImageMagick/releases/latest --jq '.tag_name')"
          fi

          test -n "$RELEASE_TAG"
          echo "Latest ImageMagick release: $RELEASE_TAG"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists in this repo"
            if [ "$FORCE_BUILD" != "true" ]; then
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              echo "Skipping build because the release tag already exists"
              exit 0
            fi
          fi

          echo "should_build=true" >> "$GITHUB_OUTPUT"

  build-amd64:
    needs: check-and-build
    if: needs.check-and-build.outputs.should_build == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ImageMagick for amd64
        env:
          FULL_DELEGATES: ${{ github.event.inputs.full_delegates || 'true' }}
        run: |
          set -euxo pipefail
          chmod +x ./build.sh
          ./build.sh "${{ needs.check-and-build.outputs.release_tag }}" amd64

      - name: Validate amd64 artifact
        run: |
          set -euxo pipefail
          archive="build/imagemagick-${{ needs.check-and-build.outputs.release_tag }}-linux-amd64.tar.gz"
          test -f "$archive"
          ls -lh "$archive"

      - name: Upload amd64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: imagemagick-amd64
          path: build/imagemagick-${{ needs.check-and-build.outputs.release_tag }}-linux-amd64.tar.gz
          retention-days: 30

  build-arm64:
    needs: check-and-build
    if: needs.check-and-build.outputs.should_build == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ImageMagick for arm64
        env:
          FULL_DELEGATES: ${{ github.event.inputs.full_delegates || 'true' }}
        run: |
          set -euxo pipefail
          chmod +x ./build.sh
          ./build.sh "${{ needs.check-and-build.outputs.release_tag }}" arm64

      - name: Validate arm64 artifact
        run: |
          set -euxo pipefail
          archive="build/imagemagick-${{ needs.check-and-build.outputs.release_tag }}-linux-arm64.tar.gz"
          test -f "$archive"
          ls -lh "$archive"

      - name: Upload arm64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: imagemagick-arm64
          path: build/imagemagick-${{ needs.check-and-build.outputs.release_tag }}-linux-arm64.tar.gz
          retention-days: 30

  publish:
    needs: [check-and-build, build-amd64, build-arm64]
    if: needs.check-and-build.outputs.should_build == 'true'
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download amd64 artifact
        uses: actions/download-artifact@v4
        with:
          name: imagemagick-amd64
          path: /tmp/artifacts/amd64

      - name: Download arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: imagemagick-arm64
          path: /tmp/artifacts/arm64

      - name: Generate release BOM from dependencies.lock
        run: |
          set -euxo pipefail

          RELEASE_TAG="${{ needs.check-and-build.outputs.release_tag }}"
          BOM_FILE="/tmp/artifacts/imagemagick-${RELEASE_TAG}-dependencies.bom.txt"
          RELEASE_NOTES_FILE="/tmp/artifacts/imagemagick-${RELEASE_TAG}-release-notes.md"

          # shellcheck source=/dev/null
          source ./dependencies.lock

          repo_http_url() {
            local repo_url="$1"
            repo_url="${repo_url%.git}"
            if [[ "$repo_url" == git@github.com:* ]]; then
              repo_url="https://github.com/${repo_url#git@github.com:}"
            elif [[ "$repo_url" == git@gitlab.com:* ]]; then
              repo_url="https://gitlab.com/${repo_url#git@gitlab.com:}"
            fi
            printf '%s\n' "$repo_url"
          }

          repo_release_link() {
            local repo_url="$1"
            local tag="$2"
            local base
            base="$(repo_http_url "$repo_url")"

            if [[ "$tag" =~ ^[0-9a-f]{40}$ ]]; then
              if [[ "$base" == https://github.com/* ]]; then
                printf '%s\n' "$base/commit/$tag"
              elif [[ "$base" == https://gitlab.com/* || "$base" == https://gitlab.gnome.org/* || "$base" == https://gitlab.freedesktop.org/* ]]; then
                printf '%s\n' "$base/-/commit/$tag"
              else
                printf '%s\n' "$base"
              fi
            elif [[ "$base" == https://github.com/* ]]; then
              printf '%s\n' "$base/releases/tag/$tag"
            elif [[ "$base" == https://gitlab.com/* || "$base" == https://gitlab.gnome.org/* || "$base" == https://gitlab.freedesktop.org/* ]]; then
              printf '%s\n' "$base/-/tags/$tag"
            else
              printf '%s\n' "$base"
            fi
          }

          {
            echo "ImageMagick Release BOM"
            echo "Release tag: $RELEASE_TAG"
            echo "Generated from: dependencies.lock"
            echo
            printf '%-18s %-60s %s\n' "Dependency" "Repository" "Tag"
            printf '%-18s %-60s %s\n' "----------" "----------" "---"
            printf '%-18s %-60s %s\n' "zlib" "$ZLIB_REPO" "$ZLIB_TAG"
            printf '%-18s %-60s %s\n' "libdeflate" "$LIBDEFLATE_REPO" "$LIBDEFLATE_TAG"
            printf '%-18s %-60s %s\n' "libjpeg-turbo" "$LIBJPEG_TURBO_REPO" "$LIBJPEG_TURBO_TAG"
            printf '%-18s %-60s %s\n' "libpng" "$LIBPNG_REPO" "$LIBPNG_TAG"
            printf '%-18s %-60s %s\n' "bzip2" "$BZIP2_REPO" "$BZIP2_TAG"
            printf '%-18s %-60s %s\n' "zstd" "$ZSTD_REPO" "$ZSTD_TAG"
            printf '%-18s %-60s %s\n' "openjpeg" "$OPENJPEG_REPO" "$OPENJPEG_TAG"
            printf '%-18s %-60s %s\n' "lcms2" "$LCMS2_REPO" "$LCMS2_TAG"
            printf '%-18s %-60s %s\n' "xz" "$XZ_REPO" "$XZ_TAG"
            printf '%-18s %-60s %s\n' "libxml2" "$LIBXML2_REPO" "$LIBXML2_TAG"
            printf '%-18s %-60s %s\n' "libzip" "$LIBZIP_REPO" "$LIBZIP_TAG"
            printf '%-18s %-60s %s\n' "meson" "$MESON_REPO" "$MESON_TAG"
            printf '%-18s %-60s %s\n' "pcre2" "$PCRE2_REPO" "$PCRE2_TAG"
            printf '%-18s %-60s %s\n' "libffi" "$LIBFFI_REPO" "$LIBFFI_TAG"
            printf '%-18s %-60s %s\n' "glib" "$GLIB_REPO" "$GLIB_TAG"
            printf '%-18s %-60s %s\n' "gvdb" "$GVDB_REPO" "$GVDB_REF"
            printf '%-18s %-60s %s\n' "liblqr" "$LIBLQR_REPO" "$LIBLQR_TAG"
            printf '%-18s %-60s %s\n' "fribidi" "$FRIBIDI_REPO" "$FRIBIDI_TAG"
            printf '%-18s %-60s %s\n' "libraqm" "$LIBRAQM_REPO" "$LIBRAQM_TAG"
            printf '%-18s %-60s %s\n' "imath" "$IMATH_REPO" "$IMATH_TAG"
            printf '%-18s %-60s %s\n' "openexr" "$OPENEXR_REPO" "$OPENEXR_TAG"
            printf '%-18s %-60s %s\n' "libde265" "$LIBDE265_REPO" "$LIBDE265_TAG"
            printf '%-18s %-60s %s\n' "libheif" "$LIBHEIF_REPO" "$LIBHEIF_TAG"
            printf '%-18s %-60s %s\n' "libraw" "$LIBRAW_REPO" "$LIBRAW_TAG"
            printf '%-18s %-60s %s\n' "freetype" "$FREETYPE_REPO" "$FREETYPE_TAG"
            printf '%-18s %-60s %s\n' "harfbuzz" "$HARFBUZZ_REPO" "$HARFBUZZ_TAG"
            printf '%-18s %-60s %s\n' "libwebp" "$LIBWEBP_REPO" "$LIBWEBP_TAG"
            printf '%-18s %-60s %s\n' "libtiff" "$LIBTIFF_REPO" "$LIBTIFF_TAG"
            printf '%-18s %-60s %s\n' "fontconfig" "$FONTCONFIG_REPO" "$FONTCONFIG_TAG"
            echo
            echo "Raw lock file contents:"
            cat ./dependencies.lock
          } > "$BOM_FILE"

          IMAGEMAGICK_RELEASE_URL="https://github.com/ImageMagick/ImageMagick/releases/tag/${RELEASE_TAG}"

          {
            echo "# ImageMagick ${RELEASE_TAG}"
            echo
            echo "Upstream ImageMagick release: [${RELEASE_TAG}](${IMAGEMAGICK_RELEASE_URL})"
            echo
            echo "## Build BOM"
            echo
            echo "| Library | Repository | Tag | Upstream Tag/Release |"
            echo "| --- | --- | --- | --- |"
            printf '| %s | %s | %s | [link](%s) |\n' "zlib" "[repo]($(repo_http_url "$ZLIB_REPO"))" "$ZLIB_TAG" "$(repo_release_link "$ZLIB_REPO" "$ZLIB_TAG")"
            printf '| %s | %s | %s | [link](%s) |\n' "libdeflate" "[repo]($(repo_http_url "$LIBDEFLATE_REPO"))" "$LIBDEFLATE_TAG" "$(repo_release_link "$LIBDEFLATE_REPO" "$LIBDEFLATE_TAG")"
            printf '| %s | %s | %s | [link](%s) |\n' "libjpeg-turbo" "[repo]($(repo_http_url "$LIBJPEG_TURBO_REPO"))" "$LIBJPEG_TURBO_TAG" "$(repo_release_link "$LIBJPEG_TURBO_REPO" "$LIBJPEG_TURBO_TAG")"
            printf '| %s | %s | %s | [link](%s) |\n' "libpng" "[repo]($(repo_http_url "$LIBPNG_REPO"))" "$LIBPNG_TAG" "$(repo_release_link "$LIBPNG_REPO" "$LIBPNG_TAG")"
            printf '| %s | %s | %s | [link](%s) |\n' "bzip2" "[repo]($(repo_http_url "$BZIP2_REPO"))" "$BZIP2_TAG" "$(repo_release_link "$BZIP2_REPO" "$BZIP2_TAG")"
            printf '| %s | %s | %s | [link](%s) |\n' "zstd" "[repo]($(repo_http_url "$ZSTD_REPO"))" "$ZSTD_TAG" "$(repo_release_link "$ZSTD_REPO" "$ZSTD_TAG")"
            printf '| %s | %s | %s | [link](%s) |\n' "openjpeg" "[repo]($(repo_http_url "$OPENJPEG_REPO"))" "$OPENJPEG_TAG" "$(repo_release_link "$OPENJPEG_REPO" "$OPENJPEG_TAG")"
            printf '| %s | %s | %s | [link](%s) |\n' "lcms2" "[repo]($(repo_http_url "$LCMS2_REPO"))" "$LCMS2_TAG" "$(repo_release_link "$LCMS2_REPO" "$LCMS2_TAG")"
            printf '| %s | %s | %s | [link](%s) |\n' "xz" "[repo]($(repo_http_url "$XZ_REPO"))" "$XZ_TAG" "$(repo_release_link "$XZ_REPO" "$XZ_TAG")"
            printf '| %s | %s | %s | [link](%s) |\n' "libxml2" "[repo]($(repo_http_url "$LIBXML2_REPO"))" "$LIBXML2_TAG" "$(repo_release_link "$LIBXML2_REPO" "$LIBXML2_TAG")"
            printf '| %s | %s | %s | [link](%s) |\n' "libzip" "[repo]($(repo_http_url "$LIBZIP_REPO"))" "$LIBZIP_TAG" "$(repo_release_link "$LIBZIP_REPO" "$LIBZIP_TAG")"
            printf '| %s | %s | %s | [link](%s) |\n' "meson" "[repo]($(repo_http_url "$MESON_REPO"))" "$MESON_TAG" "$(repo_release_link "$MESON_REPO" "$MESON_TAG")"
            printf '| %s | %s | %s | [link](%s) |\n' "pcre2" "[repo]($(repo_http_url "$PCRE2_REPO"))" "$PCRE2_TAG" "$(repo_release_link "$PCRE2_REPO" "$PCRE2_TAG")"
            printf '| %s | %s | %s | [link](%s) |\n' "libffi" "[repo]($(repo_http_url "$LIBFFI_REPO"))" "$LIBFFI_TAG" "$(repo_release_link "$LIBFFI_REPO" "$LIBFFI_TAG")"
            printf '| %s | %s | %s | [link](%s) |\n' "glib" "[repo]($(repo_http_url "$GLIB_REPO"))" "$GLIB_TAG" "$(repo_release_link "$GLIB_REPO" "$GLIB_TAG")"
            printf '| %s | %s | %s | [link](%s) |\n' "gvdb" "[repo]($(repo_http_url "$GVDB_REPO"))" "$GVDB_REF" "$(repo_release_link "$GVDB_REPO" "$GVDB_REF")"
            printf '| %s | %s | %s | [link](%s) |\n' "liblqr" "[repo]($(repo_http_url "$LIBLQR_REPO"))" "$LIBLQR_TAG" "$(repo_release_link "$LIBLQR_REPO" "$LIBLQR_TAG")"
            printf '| %s | %s | %s | [link](%s) |\n' "fribidi" "[repo]($(repo_http_url "$FRIBIDI_REPO"))" "$FRIBIDI_TAG" "$(repo_release_link "$FRIBIDI_REPO" "$FRIBIDI_TAG")"
            printf '| %s | %s | %s | [link](%s) |\n' "libraqm" "[repo]($(repo_http_url "$LIBRAQM_REPO"))" "$LIBRAQM_TAG" "$(repo_release_link "$LIBRAQM_REPO" "$LIBRAQM_TAG")"
            printf '| %s | %s | %s | [link](%s) |\n' "imath" "[repo]($(repo_http_url "$IMATH_REPO"))" "$IMATH_TAG" "$(repo_release_link "$IMATH_REPO" "$IMATH_TAG")"
            printf '| %s | %s | %s | [link](%s) |\n' "openexr" "[repo]($(repo_http_url "$OPENEXR_REPO"))" "$OPENEXR_TAG" "$(repo_release_link "$OPENEXR_REPO" "$OPENEXR_TAG")"
            printf '| %s | %s | %s | [link](%s) |\n' "libde265" "[repo]($(repo_http_url "$LIBDE265_REPO"))" "$LIBDE265_TAG" "$(repo_release_link "$LIBDE265_REPO" "$LIBDE265_TAG")"
            printf '| %s | %s | %s | [link](%s) |\n' "libheif" "[repo]($(repo_http_url "$LIBHEIF_REPO"))" "$LIBHEIF_TAG" "$(repo_release_link "$LIBHEIF_REPO" "$LIBHEIF_TAG")"
            printf '| %s | %s | %s | [link](%s) |\n' "libraw" "[repo]($(repo_http_url "$LIBRAW_REPO"))" "$LIBRAW_TAG" "$(repo_release_link "$LIBRAW_REPO" "$LIBRAW_TAG")"
            printf '| %s | %s | %s | [link](%s) |\n' "freetype" "[repo]($(repo_http_url "$FREETYPE_REPO"))" "$FREETYPE_TAG" "$(repo_release_link "$FREETYPE_REPO" "$FREETYPE_TAG")"
            printf '| %s | %s | %s | [link](%s) |\n' "harfbuzz" "[repo]($(repo_http_url "$HARFBUZZ_REPO"))" "$HARFBUZZ_TAG" "$(repo_release_link "$HARFBUZZ_REPO" "$HARFBUZZ_TAG")"
            printf '| %s | %s | %s | [link](%s) |\n' "libwebp" "[repo]($(repo_http_url "$LIBWEBP_REPO"))" "$LIBWEBP_TAG" "$(repo_release_link "$LIBWEBP_REPO" "$LIBWEBP_TAG")"
            printf '| %s | %s | %s | [link](%s) |\n' "libtiff" "[repo]($(repo_http_url "$LIBTIFF_REPO"))" "$LIBTIFF_TAG" "$(repo_release_link "$LIBTIFF_REPO" "$LIBTIFF_TAG")"
            printf '| %s | %s | %s | [link](%s) |\n' "fontconfig" "[repo]($(repo_http_url "$FONTCONFIG_REPO"))" "$FONTCONFIG_TAG" "$(repo_release_link "$FONTCONFIG_REPO" "$FONTCONFIG_TAG")"
            echo
            echo "Build artifacts in this release are statically linked and produced by this repository's workflow."
          } > "$RELEASE_NOTES_FILE"

          ls -lh "$BOM_FILE"
          ls -lh "$RELEASE_NOTES_FILE"

      - name: Create release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail

          RELEASE_TAG="${{ needs.check-and-build.outputs.release_tag }}"
          AMD64_ARCHIVE="/tmp/artifacts/amd64/imagemagick-${RELEASE_TAG}-linux-amd64.tar.gz"
          ARM64_ARCHIVE="/tmp/artifacts/arm64/imagemagick-${RELEASE_TAG}-linux-arm64.tar.gz"
          BOM_FILE="/tmp/artifacts/imagemagick-${RELEASE_TAG}-dependencies.bom.txt"
          RELEASE_NOTES_FILE="/tmp/artifacts/imagemagick-${RELEASE_TAG}-release-notes.md"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file "$RELEASE_NOTES_FILE"
            gh release upload "$RELEASE_TAG" \
              "$AMD64_ARCHIVE" \
              "$ARM64_ARCHIVE" \
              "$BOM_FILE" \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              --target "${GITHUB_SHA}" \
              --title "ImageMagick $RELEASE_TAG" \
              --notes-file "$RELEASE_NOTES_FILE" \
              "$AMD64_ARCHIVE" \
              "$ARM64_ARCHIVE" \
              "$BOM_FILE"
          fi
