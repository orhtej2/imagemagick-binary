name: Update Dependency Lock

'on':
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:

jobs:
  update-lock:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update dependency lock file
        run: |
          ./update-dependency-lock.sh

      - name: Detect lock changes
        id: lock-changes
        run: |
          if git diff --quiet -- dependencies.lock; then
            echo "No dependency updates"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create pull request for dependency lock update
        if: steps.lock-changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore: update dependency lock"
          title: "chore: update dependency lock"
          body: |
            Automated dependency lock refresh generated by the scheduled workflow.
          branch: ci/update-dependency-lock
          delete-branch: true
